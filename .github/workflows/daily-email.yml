name: daily-email

on:
  schedule:
    # GitHub Actions cron 是 best-effort，高负载时会跳过。用10个cron覆盖08:30-09:30，sent_log防重发
    - cron: "30 0 * * *"   # 08:30
    - cron: "35 0 * * *"   # 08:35
    - cron: "40 0 * * *"   # 08:40
    - cron: "45 0 * * *"   # 08:45
    - cron: "50 0 * * *"   # 08:50
    - cron: "55 0 * * *"   # 08:55
    - cron: "0 1 * * *"    # 09:00
    - cron: "10 1 * * *"   # 09:10
    - cron: "20 1 * * *"   # 09:20
    - cron: "30 1 * * *"   # 09:30
  # 外部cron服务（cron-job.org等）通过此事件触发
  repository_dispatch:
    types: [send-daily]
  # 支持在 Actions 页面手动点击运行，用于测试
  workflow_dispatch:
    inputs:
      force_issue:
        description: "手动指定期号发送（如 1 = 第001期；留空则按当天日期，课前/课后不发）"
        required: false
        default: ""

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许 workflow 把 sent_log.json 推送回仓库
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send daily email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FORCE_ISSUE: ${{ github.event.inputs.force_issue }}
        run: python send_daily.py

      - name: Commit send log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sent_log.json
          git diff --cached --quiet || git commit -m "send log: $(date -u +%F)"
          git push

      - name: Result
        run: echo "done at $(date)"
